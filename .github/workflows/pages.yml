# Publishes the Card Forge to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish Card Forge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Safety gate: a file with a syntax error never goes live.
      - name: Check scripts
        run: for f in *.js; do node --check "$f"; done
      - name: Assemble site
        run: |
          mkdir _site
          for f in $(ls -A); do
            case "$f" in .git|.github|_site|README.md|.gitignore) ;; *) cp -r "$f" _site/ ;; esac
          done
          printf '{"sha":"%s","date":"%s","repo":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > _site/build.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
